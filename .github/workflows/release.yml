name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.8.3'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          cmake --build build
      - name: Package
        shell: pwsh
        run: |
          pip install imageio-ffmpeg
          $ff = python -c "import imageio_ffmpeg as i;print(i.get_ffmpeg_exe())"
          New-Item -ItemType Directory -Path dist/Clipline | Out-Null
          windeployqt --no-translations --no-system-d3d-compiler --no-opengl-sw --dir dist/Clipline build/Clipline.exe
          Copy-Item build/Clipline.exe dist/Clipline/
          Copy-Item $ff dist/Clipline/ffmpeg.exe
          Copy-Item LICENSE, README.md dist/Clipline/
          Compress-Archive -Path dist/Clipline -DestinationPath Clipline-windows-x64.zip
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" packaging/windows/clipline.iss
          Move-Item dist/Clipline-windows-x64-setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Clipline-windows-x64.zip
            Clipline-windows-x64-setup.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libx11-dev libgl1-mesa-dev cmake ninja-build python3-venv dpkg-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          strip build/clipline
      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VER=0.0.0" >> "$GITHUB_ENV"; fi
      - name: deb package
        run: |
          DESTDIR="$PWD/pkg/deb" cmake --install build
          mkdir -p pkg/deb/DEBIAN
          {
            echo "Package: clipline"
            echo "Version: ${VER}"
            echo "Section: video"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Depends: libqt6widgets6, libqt6network6, libx11-6, ffmpeg"
            echo "Maintainer: Clipline <noreply@users.noreply.github.com>"
            echo "Description: Save the last moments of your screen with one key"
            echo " Records quietly in the background and keeps the last minutes in memory."
          } > pkg/deb/DEBIAN/control
          dpkg-deb --build --root-owner-group pkg/deb clipline_amd64.deb
      - name: tar.gz package
        run: |
          D=clipline-linux-x86_64
          mkdir "$D"
          cp build/clipline "$D/clipline"
          cp assets/icon.png assets/clipline.desktop packaging/linux/install.sh LICENSE README.md "$D/"
          tar czf clipline-linux-x86_64.tar.gz "$D"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            clipline_amd64.deb
            clipline-linux-x86_64.tar.gz

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm base-devel git cmake ninja qt6-base libx11 ffmpeg
      - uses: actions/checkout@v4
      - name: makepkg
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=arch step failed::line $LINENO: $BASH_COMMAND"' ERR
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0"; fi
          useradd -m builder
          mkdir /home/builder/pkg
          tar czf /home/builder/pkg/clipline-src.tar.gz --exclude=.git --exclude=build --exclude=dist --exclude=docs .
          cp packaging/arch/PKGBUILD /home/builder/pkg/
          sed -i "s/^pkgver=.*/pkgver=${VER}/" /home/builder/pkg/PKGBUILD
          chown -R builder /home/builder/pkg
          cd /home/builder/pkg
          if ! su builder -c "makepkg -f --noconfirm" > /tmp/makepkg.log 2>&1; then
            tail -n 60 /tmp/makepkg.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > /tmp/tail.txt
            echo "::error title=makepkg failed::$(cat /tmp/tail.txt)"
            exit 1
          fi
          cp clipline-[0-9]*-x86_64.pkg.tar.zst "$GITHUB_WORKSPACE/clipline-x86_64.pkg.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: clipline-x86_64.pkg.tar.zst

  macos:
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            name: intel
          - os: macos-15
            name: apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
          cmake --build build --parallel
      - name: Package
        run: |
          python3 -m venv .venv
          .venv/bin/pip install imageio-ffmpeg
          FF=$(.venv/bin/python -c "import imageio_ffmpeg as i;print(i.get_ffmpeg_exe())")
          macdeployqt build/Clipline.app
          cp "$FF" build/Clipline.app/Contents/MacOS/ffmpeg
          chmod +x build/Clipline.app/Contents/MacOS/ffmpeg
          codesign --force --deep -s - build/Clipline.app
          mkdir dmg
          cp -R build/Clipline.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Clipline -srcfolder dmg -ov -format UDZO "Clipline-macos-${{ matrix.name }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}
          path: Clipline-macos-${{ matrix.name }}.dmg

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' }}
    needs: [windows, linux, arch, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
